name: Pre-Commit

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
      - uses: pre-commit/action@v3.0.1
        env:
          # lychee falls back to the GitHub API for github.com links when the
          # page itself fails (github.com often 429/5xxs requests from runners),
          # but only if it has a token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
