site_name: KFactory
repo_url: https://github.com/gdsfactory/kfactory
site_url: https://gdsfactory.github.io/kfactory/
site_description: >-
  Python framework for photonic and electronic chip layout, built on
  KLayout's C++ geometry engine.
docs_dir: source-built
# Fail the build on broken links, missing anchors and invalid autorefs.
strict: true

nav:
  - Home: index.md
  - Getting Started:
      - Prerequisites: getting_started/prerequisites.md
      - Installation: getting_started/installation.md
      - 5-Minute Quickstart: getting_started/quickstart.md
      - KLive Setup: getting_started/klive_setup.md
  - Concepts:
      - KCell: concepts/kcell.md
      - Layers: concepts/layers.md
      - Ports: concepts/ports.md
      - Instances: concepts/instances.md
      - Geometry: concepts/geometry.md
      - KCLayout: concepts/kclayout.md
      - DBU vs µm: concepts/dbu_vs_um.md
  - Components:
      - Cells:
          - Overview: components/cells/overview.md
          - PCells: components/cells/pcells.md
          - Virtual PCells: components/cells/virtual.md
          - Factories:
              - Overview: components/cells/factories/overview.md
              - Straight: components/cells/factories/straight.md
              - Euler: components/cells/factories/euler.md
              - Circular: components/cells/factories/circular.md
              - Bezier: components/cells/factories/bezier.md
              - Taper: components/cells/factories/taper.md
      - Cross-Sections: components/cross_sections.md
      - Enclosures:
          - Layer Enclosure: enclosures/layer_enclosure.md
          - KCell Enclosure: enclosures/kcell_enclosure.md
  - Routing:
      - Overview: routing/overview.md
      - Optical: routing/optical.md
      - Electrical: routing/electrical.md
      - Manhattan Primitives: routing/manhattan.md
      - All-Angle: routing/all_angle.md
      - Bundle Routing Tutorial: routing/bundle.md
      - Path-Length Matching: routing/path_length.md
  - PDK:
      - Creating a PDK: pdk/creating_pdk.md
      - Technology & Layer Stack: pdk/technology.md
      - Schematics:
          - Overview: schematics/overview.md
          - Netlist & I/O: schematics/netlist.md
          - Ports & Pins: schematics/ports_and_pins.md
          - 45° Crossing: schematics/crossing45.md
  - Utilities:
      - Grid Layout: utilities/grid.md
      - DRC Fixing: utilities/drc_fix.md
      - Packing: utilities/packing.md
      - Fill: utilities/fill.md
      - Session Cache: utilities/session_cache.md
  - Guides:
      - Best Practices: howto/best_practices.md
      - Common Patterns: howto/patterns.md
      - FAQ: howto/faq.md
      - Contributing: howto/contributing.md
      - Coming from gdsfactory: gdsfactory.md
  - Reference:
      # Expanded by the native api-autonav plugin (title must match
      # `nav_section_title`, target must match `api_root_uri`).
      - API: reference/
      - Config Class: config.md
      - Migration: migration.md
      - Changelog: changelog.md
theme:
  name: zensical
  logo: _static/logo.svg
  favicon: _static/logo.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.indexes
    - content.action.copy             # "Copy as Markdown" (needs llmstxt)
  custom_dir: overrides

  palette:
    # Palette toggle for automatic mode (follow the OS setting)
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

# Multi-version docs via mike (zensical fork). The CI workflow deploys
# `main` → dev alias and tagged releases → <version> + latest alias.
# https://zensical.org/docs/compatibility/mkdocs/mike/
extra:
  version:
    provider: mike
    default: latest

extra_css:
  - _static/stylesheets/extra.css

extra_javascript:
  - _static/javascripts/width-toggle.js

markdown_extensions:
  - admonition
  - attr_list                         # required for {.md-button} and {.lg .middle}
  - md_in_html                        # required for grid-card <div markdown> blocks
  - pymdownx.superfences
  - pymdownx.tasklist
  - pymdownx.tabbed
  - pymdownx.emoji:
      # Render :material-foo: / :fontawesome-foo: as inline SVG via
      # zensical's bundled twemoji index.
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
  - pymdownx.snippets:
      check_paths: true
  - zensical.extensions.preview:
      configurations:
        - targets:
            include:
              - reference/*

plugins:
  - mkdocstrings:
      enabled: true
      enable_inventory: true
      default_handler: python
      handlers:
        python:
          options:
            show_source: true
            allow_inspection: true
            docstring_style: google
            separate_signature: true
            show_signature_annotations: true
            members_order: alphabetical
            # Submodules are exposed via the api-autonav side panel, not
            # inlined on the parent package page. Keeps the right-side
            # "On this page" TOC focused on actual class / function /
            # variable definitions in the current module.
            show_submodules: false
            show_root_heading: true
            show_root_full_path: false
            # class/func/attr badges in the "On this page" TOC, matching the
            # `mod` badges api-autonav puts in the nav.
            show_symbol_type_toc: true
            # "Used by" links to docs pages that cross-reference an object.
            backlinks: tree
            extensions:
              - griffe_pydantic
              - dataclasses
              - griffe_inherited_docstrings
              - griffe_warnings_deprecated
          # Cross-reference third-party types in signatures and docstrings.
          # KLayout publishes no inventory, so `kdb.*` stays unlinked.
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://numpy.org/doc/stable/objects.inv
            - https://docs.scipy.org/doc/scipy/objects.inv
            - https://docs.pydantic.dev/latest/objects.inv
            - https://loguru.readthedocs.io/en/stable/objects.inv
            - https://cachetools.readthedocs.io/en/stable/objects.inv
            - https://typer.tiangolo.com/objects.inv
  # Native replacement for mkdocs-api-autonav: one mkdocstrings page per
  # module under reference/, merged into the `API: reference/` nav entry.
  - api-autonav:
      modules:
        - ../src/kfactory
      nav_section_title: API
      module_options:
        # Package pages render the package docstring only. Re-exports would
        # otherwise pull the entire library onto e.g. the top-level page.
        "^kfactory(\\.(cells|cells\\.virtual|cli|factories|factories\\.virtual|routing|routing\\.aa|technology|utils|widgets))?$":
          members: false
  - mkdocs-video:
      is_video: true
      video_type: webm
      video_muted: true
      css_style:
        max-width: 100%
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: >-
        KFactory provides parametric cells with caching, optical and
        electrical routing, enclosures via Minkowski sums, and
        schematic-driven design with LVS. Lengths are integer database
        units (DBU) on `KCell` and float µm on `DKCell`.
      sections:
        Getting Started:
          - index.md
          - getting_started/*.md
        Concepts:
          - concepts/*.md
        Components:
          - components/*.md
          - enclosures/*.md
        Routing:
          - routing/*.md
        PDK & Schematics:
          - pdk/*.md
          - schematics/*.md
        Utilities & Guides:
          - utilities/*.md
          - howto/*.md
          - gdsfactory.md
          - config.md
          - migration.md
        API Reference:
          - reference/*.md
  # Social cards + Open Graph metadata. Fonts are fetched from Google Fonts
  # on first build; cards are cached in docs/.cache/plugin/social.
  - social:
      # Explicit colors: the default layout derives them from
      # `theme.palette[].primary`, which we don't set (renders as None).
      # Dark slate keeps the teal κ logo readable.
      cards_layout_options:
        background_color: "#0F172A"
        color: "#FFFFFF"
  - redirects:
      # Preserve URLs from before the cells/factories documentation reorganization.
      redirect_maps:
        components/overview.md: components/cells/overview.md
        components/straight.md: components/cells/factories/straight.md
        components/euler.md: components/cells/factories/euler.md
        components/circular.md: components/cells/factories/circular.md
        components/taper.md: components/cells/factories/taper.md
        components/bezier.md: components/cells/factories/bezier.md
        components/virtual.md: components/cells/virtual.md
        components/pcells.md: components/cells/pcells.md
        components/factories.md: components/cells/factories/overview.md
        enclosures/cross_sections.md: components/cross_sections.md
        # API pages moved under reference/kfactory/ with native api-autonav.
        reference/index.md: reference/kfactory/index.md
